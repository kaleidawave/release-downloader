name: release-downloader
description: Download releases from GitHub releases
author: kaleidawave
branding:
  icon: arrow-up-circle
  color: red

inputs:
  items:
    description: A comma separated list of items to download
    required: true
  trace:
    description: Whether to log what is being downloaded
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
  - id: make-path-linux
    if: ${{ runner.os == 'Linux' }}
    shell: bash
    run: |
      mkdir -p "$HOME/.local/bin"
      echo "$HOME/.local/bin" > "$GITHUB_PATH"

  - id: make-path-windows
    if: ${{ runner.os == 'Linux' }}
    shell: bash
    run: |
      mkdir "$HOME/.local/bin"
      echo "$HOME/.local/bin" > "$GITHUB_PATH"

  - id: run-linux
    shell: bash
    if: ${{ runner.os == 'Linux' }}
    run: |
      curl -L 'https://github.com/kaleidawave/release-downloader/releases/download/assets/release-downloader' > "$HOME/.local/bin/release-downloader"
      chmod +x "$HOME/.local/bin/release-downloader"
      if [ "${{ inputs.trace }}" == "true" ]; then
        echo "Running on Linux"
        release-downloader '${{ inputs.items }}' --trace
      else
        release-downloader '${{ inputs.items }}'
      fi

  - id: run-windows
    shell: bash
    if: ${{ runner.os == 'Windows' }}
    run: |
      curl -L 'https://github.com/kaleidawave/release-downloader/releases/download/assets/release-downloader' > "$HOME/.local/bin/release-downloader.exe"
      curl -L 'https://github.com/kaleidawave/release-downloader/releases/download/assets/release-downloader.exe' > out.exe
      if [ "${{ inputs.trace }}" == "true" ]; then
        echo "Running on Windows"
        release-downloader '${{ inputs.items }}' --trace
      else
        release-downloader '${{ inputs.items }}'
      fi
